name: Test Workflow Timeout

on:
  workflow_call:
    inputs:
      duration_minutes:
        description: "Duration in whole minutes"
        required: true
        type: number
      runner_label:
        description: "Runner label"
        required: true
        type: string

permissions: {}

jobs:
  wait:
    name: Wait ${{ inputs.duration_minutes }}m on ${{ inputs.runner_label }}
    runs-on: ${{ inputs.runner_label }}

    steps:
      - name: Wait
        shell: bash
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          case "$DURATION_MINUTES" in
            ''|*[!0-9]*)
              echo "::error::duration_minutes must be a whole number"
              exit 1
              ;;
          esac

          echo "Start: $(date -u --iso-8601=seconds)"
          echo "Duration: ${DURATION_MINUTES} minute(s)"

          deadline=$((SECONDS + DURATION_MINUTES * 60))

          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            sleep_for=$((remaining < 60 ? remaining : 60))

            echo "Remaining: ${remaining}s"
            sleep "$sleep_for"
          done

          echo "End: $(date -u --iso-8601=seconds)"
